<VirtualHost *:80>
    # Solo public/ se sirve. El codigo, la configuracion y storage/ quedan
    # fuera del alcance del servidor web.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloqueo explicito del resto del proyecto, por si alguien cambiara
    # el DocumentRoot por error.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    # Detras del proxy de Dokploy (Traefik) el esquema real viaja en las
    # cabeceras X-Forwarded-*. Recuerde poner APP_TRUST_PROXY=true.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
